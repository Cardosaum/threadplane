[workspace]
members = [
    "crates/threadplane-cli",
    "crates/threadplane-core",
    "crates/threadplane-server",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.81"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.98"
axum = { version = "0.8.4", features = ["json", "macros"] }
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.40", features = ["derive", "env"] }
dotenvy = "0.15.7"
neo4rs = "0.8.0"
reqwest = { version = "0.12.15", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sqlx = { version = "0.8.6", features = ["chrono", "json", "postgres", "runtime-tokio-rustls", "uuid"] }
tokio = { version = "1.45.0", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
uuid = { version = "1.17.0", features = ["serde", "v4"] }
