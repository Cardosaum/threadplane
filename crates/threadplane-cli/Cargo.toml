[package]
name = "threadplane-cli"
categories = ["command-line-utilities", "development-tools"]
description = "CLI for the threadplane shared memory and coordination plane"
edition.workspace = true
keywords = ["agents", "cli", "graph", "knowledge", "workflow"]
license.workspace = true
readme = "../../README.md"
repository = "https://github.com/Cardosaum/threadplane"
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "tplane"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap.workspace = true
bon.workspace = true
derive_more.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
snafu.workspace = true
strum.workspace = true
threadplane-core = { path = "../threadplane-core" }
url.workspace = true
uuid.workspace = true

[build-dependencies]
threadplane-build = { path = "../threadplane-build" }

[dev-dependencies]
proptest.workspace = true
rstest.workspace = true
